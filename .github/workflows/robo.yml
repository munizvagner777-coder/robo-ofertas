name: Robo de Ofertas

on:
  schedule:
    - cron: "*/30 * * * *"   # o GitHub atrasa muito; cada rodada fica ligada ~5h postando
  workflow_dispatch:          # botão "Run workflow" para testar na hora
    inputs:
      forcar:
        description: "Postar a primeira oferta agora, ignorando horário/intervalo (1 = sim)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Rodar o robô (fica ligado ~5h, tenta postar a cada 10 min)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          FORCAR_PRIMEIRA: ${{ github.event.inputs.forcar }}
        run: |
          git config user.name "robo-ofertas"
          git config user.email "robo@users.noreply.github.com"
          for i in $(seq 1 30); do
            git pull --rebase --quiet || true
            if [ "$i" = "1" ] && [ "$FORCAR_PRIMEIRA" = "1" ]; then
              FORCAR=1 python robo.py || true
            else
              FORCAR=0 python robo.py || true
            fi
            git add postados.json fila.txt
            if ! git diff --cached --quiet; then
              git commit -m "atualiza postados" --quiet
              git push --quiet || (git pull --rebase --quiet && git push --quiet) || true
            fi
            if [ "$i" -lt 30 ]; then sleep 600; fi
          done
