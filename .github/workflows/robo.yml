name: Robo de Ofertas

on:
  schedule:
    - cron: "*/15 * * * *"   # roda a cada 15 minutos
  workflow_dispatch:          # botão "Run workflow" para testar na hora
    inputs:
      forcar:
        description: "Postar agora ignorando horário/intervalo (1 = sim)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Rodar o robô
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          FORCAR: ${{ github.event.inputs.forcar }}
        run: python robo.py

      - name: Salvar o que já foi postado
        run: |
          git config user.name "robo-ofertas"
          git config user.email "robo@users.noreply.github.com"
          git add postados.json fila.txt
          git diff --cached --quiet || git commit -m "atualiza postados"
          git push
